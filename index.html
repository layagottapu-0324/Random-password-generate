<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
      background-image: url(img.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      
      
    }

    .container {
      width: 400px;
      background: rgba(235, 229, 229, 0.911);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .password-box {
      display: flex;
      margin-bottom: 20px;
    }

    #password {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px 0 0 8px;
      outline: none;
    }

    #copyBtn {
      padding: 0 15px;
      border: none;
      background: #384a9c;
      color: rgba(255, 255, 255, 0.356);
      cursor: pointer;
      border-radius: 0 8px 8px 0;
    }

    #copyBtn:hover {
      background: #8c96cf;
    }

    .option {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      color: #333;
    }

    input[type="number"] {
      width: 70px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .generate-btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;

      border: none;
      border-radius: 8px;

      background: #2ed573;
      color: white;

      font-size: 18px;
      font-weight: bold;

      cursor: pointer;
      transition: 0.3s;
    }

    .generate-btn:hover {
      background: #20bf6b;
      transform: scale(1.02);
    }

    #message {
      text-align: center;
      margin-top: 15px;
      color: #e74c3c;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔐 Password Generator</h1>

    <div class="password-box">
      <input
        type="text"
        id="password"
        placeholder="Your password"
        readonly
      >

      <button id="copyBtn" onclick="copyPassword()">
        Copy
      </button>
    </div>

    <div class="option">
      <label>Password Length</label>
      <input
        type="number"
        id="length"
        min="4"
        max="30"
        value="12"
      >
    </div>

    <div class="option">
      <label>Uppercase Letters (A-Z)</label>
      <input type="checkbox" id="uppercase" checked>
    </div>

    <div class="option">
      <label>Lowercase Letters (a-z)</label>
      <input type="checkbox" id="lowercase" checked>
    </div>

    <div class="option">
      <label>Numbers (0-9)</label>
      <input type="checkbox" id="numbers" checked>
    </div>

    <div class="option">
      <label>Symbols (!@#$)</label>
      <input type="checkbox" id="symbols" checked>
    </div>

    <button class="generate-btn" onclick="generatePassword()">
      Generate Password
    </button>

    <p id="message"></p>

  </div>


  <script>

    function generatePassword() {

      const length = Number(
        document.getElementById("length").value
      );

      const uppercase =
        document.getElementById("uppercase").checked;

      const lowercase =
        document.getElementById("lowercase").checked;

      const numbers =
        document.getElementById("numbers").checked;

      const symbols =
        document.getElementById("symbols").checked;

      const passwordInput =
        document.getElementById("password");

      const message =
        document.getElementById("message");


      // Character sets

      const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

      const lowerChars = "abcdefghijklmnopqrstuvwxyz";

      const numberChars = "0123456789";

      const symbolChars = "!@#$%^&*()_+{}[]<>?";


      let characters = "";


      // Add selected character types

      if (uppercase) {
        characters += upperChars;
      }

      if (lowercase) {
        characters += lowerChars;
      }

      if (numbers) {
        characters += numberChars;
      }

      if (symbols) {
        characters += symbolChars;
      }


      // Validation

      if (characters.length === 0) {

        message.textContent =
          "Please select at least one option.";

        passwordInput.value = "";

        return;
      }


      if (length < 4 || length > 30) {

        message.textContent =
          "Password length must be between 4 and 30.";

        passwordInput.value = "";

        return;
      }


      // Generate password

      let password = "";

      for (let i = 0; i < length; i++) {

        const randomIndex =
          Math.floor(Math.random() * characters.length);

        password += characters[randomIndex];

      }


      passwordInput.value = password;

      message.textContent = "";

    }


    // Copy password

    function copyPassword() {

      const password =
        document.getElementById("password").value;

      const message =
        document.getElementById("message");


      if (password === "") {

        message.textContent =
          "Generate a password first.";

        return;

      }


      navigator.clipboard.writeText(password);

      message.style.color = "#2ed573";

      message.textContent =
        "Password copied! ✓";


      setTimeout(() => {

        message.textContent = "";

      }, 2000);

    }

  </script>

</body>
</html>
